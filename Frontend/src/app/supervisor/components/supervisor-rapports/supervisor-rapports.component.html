<div class="page">

  <div class="page-header">
    <div class="page-title">Rapports & Statistiques</div>
    <div class="page-sub">Vue d'ensemble de votre équipe</div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card" *ngFor="let s of stats" [ngClass]="s.color">
      <i class="bi" [ngClass]="s.icon"></i>
      <div class="stat-val">{{ s.value }}</div>
      <div class="stat-lbl">{{ s.label }}</div>
    </div>
  </div>

  <!-- CDR Table -->
  <div class="section-lbl">Dernières missions (CDR)</div>
  <div class="card">
    <table class="cdr-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Agent</th>
          <th>Client</th>
          <th>Distance</th>
          <th>Durée</th>
          <th>Montant</th>
          <th>Statut</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of cdrLogs">
          <td class="id-col">{{ c.cdrId }}</td>
          <td>{{ c.agent }}</td>
          <td>{{ c.client }}</td>
          <td>{{ c.distance }} km</td>
          <td>{{ c.duration }} min</td>
          <td class="amount-col">{{ c.amount | number:'1.3-3' }} DT</td>
          <td>
            <span class="status-badge" [class.billed]="c.status==='BILLED'" [class.pending]="c.status==='PENDING'">
              {{ c.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
