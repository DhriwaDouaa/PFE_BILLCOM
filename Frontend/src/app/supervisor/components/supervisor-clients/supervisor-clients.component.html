<div class="page">

  <div class="page-header">
    <div>
      <div class="page-title">Mes clients</div>
      <div class="page-sub">{{ filtered.length }} client(s) dans votre équipe</div>
    </div>
  </div>

  <!-- Filtres -->
  <div class="filters card">
    <input class="search-input" type="text" [(ngModel)]="search" (ngModelChange)="applyFilter()"
           placeholder="Rechercher par nom ou téléphone..."/>
    <select [(ngModel)]="filterType" (ngModelChange)="applyFilter()">
      <option value="">Tous les types</option>
      <option value="STANDARD">Standard</option>
      <option value="VIP">VIP</option>
    </select>
  </div>

  <!-- Loading -->
  <div class="loading" *ngIf="loading">Chargement...</div>

  <!-- Liste -->
  <div class="client-list" *ngIf="!loading">
    <div class="client-card card" *ngFor="let c of filtered">
      <div class="client-initials" [class.vip]="c.clientType==='VIP'">
        {{ getInitials(c.name) }}
      </div>
      <div class="client-meta">
        <div class="client-name">
          {{ c.name }}
          <span class="vip-tag" *ngIf="c.clientType==='VIP'">VIP</span>
        </div>
        <div class="client-sub">
          <i class="bi bi-phone"></i> {{ c.phone }}
          &nbsp;·&nbsp;
          <i class="bi bi-person-fill"></i> {{ c.agentName }}
        </div>
      </div>
      <div class="client-balance">{{ c.balance | number:'1.3-3' }} DT</div>
      <span class="mission-pill" [ngClass]="getPillClass(c.missionStatus)">
        {{ getMissionLabel(c.missionStatus) }}
      </span>
    </div>

    <div class="empty" *ngIf="filtered.length === 0">
      <i class="bi bi-person-x"></i>
      <span>Aucun client trouvé</span>
    </div>
  </div>

</div>
