<div class="page">
  <div class="page-card">

    <!-- Header -->
    <div class="card-header">
      <button class="back-btn" (click)="goBack()">
        <i class="bi bi-arrow-left"></i>
      </button>
      <div>
        <div class="card-title">Changer le mot de passe</div>
        <div class="card-sub">{{ getUsername() }}</div>
      </div>
    </div>

    <!-- Success -->
    <div class="success-box" *ngIf="success">
      <i class="bi bi-check-circle-fill"></i>
      Mot de passe modifié avec succès !
    </div>

    <!-- Form -->
    <div *ngIf="!success">

      <!-- Mot de passe actuel -->
      <div class="form-group">
        <label>Mot de passe actuel</label>
        <div class="input-wrap">
          <i class="bi bi-lock input-icon"></i>
          <input [type]="showCurrent ? 'text' : 'password'"
                 [(ngModel)]="currentPassword"
                 placeholder="••••••••"/>
          <button class="eye-btn" (click)="showCurrent = !showCurrent">
            <i class="bi" [ngClass]="showCurrent ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Nouveau mot de passe -->
      <div class="form-group">
        <label>Nouveau mot de passe</label>
        <div class="input-wrap">
          <i class="bi bi-lock-fill input-icon"></i>
          <input [type]="showNew ? 'text' : 'password'"
                 [(ngModel)]="newPassword"
                 placeholder="••••••••"/>
          <button class="eye-btn" (click)="showNew = !showNew">
            <i class="bi" [ngClass]="showNew ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>

        <!-- Strength bar -->
        <div class="strength-wrap" *ngIf="newPassword">
          <div class="strength-bar">
            <div class="strength-fill" [style.width.%]="strength" [style.background]="strengthColor"></div>
          </div>
          <span class="strength-label" [style.color]="strengthColor">{{ strengthLabel }}</span>
        </div>

        <!-- Checklist -->
        <div class="checklist" *ngIf="newPassword">
          <div class="check-item" [class.ok]="hasLength">
            <i class="bi" [ngClass]="hasLength ? 'bi-check-circle-fill' : 'bi-circle'"></i>
            Au moins 8 caractères
          </div>
          <div class="check-item" [class.ok]="hasUpper">
            <i class="bi" [ngClass]="hasUpper ? 'bi-check-circle-fill' : 'bi-circle'"></i>
            Une majuscule
          </div>
          <div class="check-item" [class.ok]="hasNumber">
            <i class="bi" [ngClass]="hasNumber ? 'bi-check-circle-fill' : 'bi-circle'"></i>
            Un chiffre
          </div>
          <div class="check-item" [class.ok]="hasSpecial">
            <i class="bi" [ngClass]="hasSpecial ? 'bi-check-circle-fill' : 'bi-circle'"></i>
            Un caractère spécial
          </div>
        </div>
      </div>

      <!-- Confirmer -->
      <div class="form-group">
        <label>Confirmer le nouveau mot de passe</label>
        <div class="input-wrap">
          <i class="bi bi-lock-fill input-icon"></i>
          <input [type]="showConfirm ? 'text' : 'password'"
                 [(ngModel)]="confirmPassword"
                 placeholder="••••••••"/>
          <button class="eye-btn" (click)="showConfirm = !showConfirm">
            <i class="bi" [ngClass]="showConfirm ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <div class="match-ok" *ngIf="confirmPassword && newPassword === confirmPassword">
          <i class="bi bi-check-circle-fill"></i> Les mots de passe correspondent
        </div>
        <div class="match-err" *ngIf="confirmPassword && newPassword !== confirmPassword">
          <i class="bi bi-x-circle-fill"></i> Les mots de passe ne correspondent pas
        </div>
      </div>

      <!-- Error -->
      <div class="error-box" *ngIf="error">{{ error }}</div>

      <!-- Submit -->
      <button class="btn-submit" (click)="submit()" [disabled]="loading">
        {{ loading ? 'Modification...' : 'Modifier le mot de passe' }}
      </button>

    </div>
  </div>
</div>
